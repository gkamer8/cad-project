[project]
name = "cad-project"
version = "0.1.0"
description = "CadQuery designs for in-house fabrication."
requires-python = ">=3.10,<3.13"
dependencies = [
    "cadquery>=2.4",
]

[dependency-groups]
dev = [
    "ruff",
    "cq-studio>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
